name: Release

# Builds the Windows executable.
#
# * Push a tag like `v0.1.0`  -> builds, then publishes a GitHub release with
#   the zip attached.
# * "Run workflow" button     -> builds only; download the zip from the run's
#   artifacts. Handy for trying a build without cutting a release.
# * A pull request that edits this file -> builds only, so changes to the
#   workflow are tested before they are merged.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 exe
    runs-on: windows-latest
    outputs:
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "buildrail-app") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version). Bump [workspace.package] version, or tag v$version."
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p buildrail-app

      - name: Package
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="buildrail-$GITHUB_REF_NAME-windows-x64"
          else
            name="buildrail-${GITHUB_SHA::7}-windows-x64"
          fi
          mkdir "$name"
          cp target/release/buildrail.exe README.md "$name/"
          7z a "$name.zip" "$name" > /dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "asset=$name" >> "$GITHUB_OUTPUT"
          ls -l "$name" "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            ${{ steps.package.outputs.asset }}.zip
            ${{ steps.package.outputs.asset }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.asset }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BuildRail $GITHUB_REF_NAME" \
            --generate-notes \
            "${{ needs.windows.outputs.asset }}.zip" \
            "${{ needs.windows.outputs.asset }}.zip.sha256"
