name: Test build

# Every pull request gets a Windows build to try before it is merged: open
# the run from the pull request's checks, scroll to Artifacts, and download
# the zip. It holds buildrail.exe, a "Try the demo.cmd" to double-click, the
# README and the changelog. The "Run workflow" button does the same for any
# branch.
#
# This is a try-it build, not a release: it has no update signing key, so it
# never updates itself, and nothing is published.
#
# The smoke run then starts that build's demo on a real Windows desktop,
# takes a screenshot, closes it, and keeps the screenshot and BuildRail's
# log as an artifact ("smoke-run"), so docking can be seen and read without
# a person at a Windows machine. It fails only if the app died early or
# panicked; a missing screenshot is a warning.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows test build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p buildrail-app

      - name: Package
        id: package
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then label="pr$PR_NUMBER-${HEAD_SHA:0:7}"; else label="${GITHUB_REF_NAME//\//-}-${HEAD_SHA:0:7}"; fi
          name="buildrail-$label-windows-x86_64"
          mkdir "$name"
          cp target/release/buildrail.exe README.md CHANGELOG.md "$name/"
          printf '@echo off\r\nstart "" "%%~dp0buildrail.exe" --demo\r\n' > "$name/Try the demo.cmd"
          7z a -tzip "$name.zip" "$name" > /dev/null
          echo "zip=$name.zip" >> "$GITHUB_OUTPUT"
          ls -l "$name" "$name.zip"

      # The program on its own, for the smoke run below; kept a day.
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-run-program
          path: target/release/buildrail.exe
          if-no-files-found: error
          retention-days: 1

      # Uploaded as the zip itself (archive: false), so the download is the
      # zip and not a zip inside a zip.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Windows smoke run
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      SMOKE_DIR: ${{ github.workspace }}\buildrail-smoke
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smoke-run-program
          path: program

      # GitHub's Windows machines have no graphics card, and Windows' built-in
      # software OpenGL stops at version 1.1; BuildRail needs 2.0. Put Mesa's
      # software OpenGL beside the exe, for this test run only. It is never
      # part of a download.
      - name: Add software OpenGL for the test machine
        uses: ssciwr/setup-mesa-dist-win@v3

      # Start the demo with its files in a scratch folder, give it ten
      # seconds to dock, photograph the whole desktop, then ask it to close
      # (WM_CLOSE, as the taskbar would) so the log also shows the screen
      # edge being given back.
      - name: Run the demo and take a screenshot
        id: run
        run: |
          New-Item -ItemType Directory -Force -Path $env:SMOKE_DIR | Out-Null
          $env:BUILDRAIL_CONFIG_DIR = $env:SMOKE_DIR
          $env:RUST_LOG = 'warn,buildrail_app=debug,buildrail_platform=debug'
          $out = Join-Path $env:SMOKE_DIR 'stdout.txt'
          $err = Join-Path $env:SMOKE_DIR 'stderr.txt'
          $p = Start-Process -FilePath 'program\buildrail.exe' -ArgumentList '--demo' -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 10
          $alive = -not $p.HasExited
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $env:SMOKE_DIR 'screenshot.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            Write-Output "Screenshot: $($screen.Width)x$($screen.Height) at ($($screen.Left), $($screen.Top))"
          } catch {
            Write-Output "::warning::No screenshot of the desktop: $_"
          }
          if ($alive) {
            taskkill /PID $p.Id | Out-Null
            if (-not $p.WaitForExit(10000)) {
              Write-Output "::warning::BuildRail did not close within 10 s of being asked; stopping it"
              Stop-Process -Id $p.Id -Force
            }
          } else {
            Write-Output "::error::buildrail.exe exited within 10 seconds (exit code $($p.ExitCode))"
          }
          "alive=$alive" >> $env:GITHUB_OUTPUT

      - name: Check the log
        run: |
          $logs = Get-ChildItem -Path (Join-Path $env:SMOKE_DIR 'logs') -Filter '*.log' -ErrorAction SilentlyContinue
          if (-not $logs) { Write-Output "::warning::BuildRail wrote no log file" }
          $files = @($logs | ForEach-Object { $_.FullName }) + @(
            (Join-Path $env:SMOKE_DIR 'stdout.txt'),
            (Join-Path $env:SMOKE_DIR 'stderr.txt')
          ) | Where-Object { Test-Path $_ }
          foreach ($file in $files) {
            Write-Output "===== $file"
            Get-Content $file
          }
          $text = ($files | ForEach-Object { Get-Content $_ -Raw }) -join "`n"
          $failed = $false
          if ($text -match 'panicked at|BuildRail crashed') {
            Write-Output "::error::BuildRail panicked during the smoke run (see the log above)"
            $failed = $true
          }
          if ('${{ steps.run.outputs.alive }}' -ne 'True') { $failed = $true }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-run
          path: |
            ${{ env.SMOKE_DIR }}\screenshot.png
            ${{ env.SMOKE_DIR }}\logs
            ${{ env.SMOKE_DIR }}\stdout.txt
            ${{ env.SMOKE_DIR }}\stderr.txt
          if-no-files-found: warn
          retention-days: 14
