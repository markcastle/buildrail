name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb (the X11 docking tests need a display)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # The gate is deliberately below the current figure so that a small
      # refactor does not fail the build, but a real drop does.
      - run: xvfb-run -a cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 90
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, so the next version can be worked out
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Release button reads CHANGELOG.md to number and describe a
      # release; a malformed one is caught here rather than when it is pressed.
      - run: cargo run --locked -p xtask -- changelog check
      # The release command's own tests run with the rest of the workspace
      # in the Test jobs. This says what pressing Release now would do.
      - name: What the next release would be
        run: |
          if cargo run --quiet --locked -p xtask -- release --dry-run 2> "$RUNNER_TEMP/plan.txt"; then
            { echo "### If released now"; echo; head -1 "$RUNNER_TEMP/plan.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/plan.txt"

  workflows:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # actionlint checks every workflow (and, through shellcheck, which the
      # runner has, every run: script), so a mistake in the release
      # workflow is caught in the pull request and not on release day.
      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Check the install script
        run: shellcheck scripts/install.sh

  msrv:
    name: Minimum supported Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
        env:
          RUSTFLAGS: ""
