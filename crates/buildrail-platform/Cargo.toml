[package]
name = "buildrail-platform"
description = "BuildRail platform adapters: credential store, edge docking, fullscreen detection, URL opening, launch at login."
version.workspace = true
edition.workspace = true
# keyring 4.x (the OS credential store adapter) requires Rust 1.88, and
# `File::try_lock` (the single-instance lock file) Rust 1.89.
rust-version = "1.89"
license.workspace = true

[dependencies]
buildrail-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
raw-window-handle = { version = "0.6", features = ["std"] }
keyring = "4"
url = "2"
webbrowser = { version = "1", features = ["hardened"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
x11rb = { version = "0.14", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
